[package]
name = "solver-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `default-features = false` drops rayon: it cannot spawn threads on
# wasm32-unknown-unknown, so the engine's sequential CFR branch is the only path here.
engine = { path = "../engine", default-features = false }
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde_json = "1"
wasm-bindgen = "0.2"
