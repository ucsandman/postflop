[package]
name = "solver-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "solver"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
clap = { version = "4", features = ["derive"] }
rayon = "1"
# Only for `--tournament <file.toml>`: parse the file's `[tournament]` table and
# hand the value to the engine's own `Tournament` deserializer.
toml = "0.8"
