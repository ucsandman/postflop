*{margin:0;padding:0;box-sizing:border-box;border-radius:0!important;box-shadow:none!important}
body{min-height:100vh;display:grid;place-items:center;background:#171A18;color:#F0F3F0;
  font:400 16px/1.55 "Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:24px}

main{border:1px solid #333930;background:#12150F;max-width:640px;width:100%}
.ribbon{display:flex;height:4px}
.ribbon i{flex:1;display:block}
.ribbon i:nth-child(1){background:#3A403A}

.ribbon i:nth-child(3){background:#5B8CFF}
.ribbon i:nth-child(4){background:#25C97A}
.body{padding:clamp(28px,5vw,52px)}
.chip{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);
  width:22px;height:22px;margin-bottom:22px}
.chip i{display:block}
.chip i:nth-child(1){background:#3A403A}
.chip i:nth-child(2){background:#FF4D5A}

.chip i:nth-child(4){background:#25C97A}
.code{font:400 12.5px/1 "Azeret Mono",ui-monospace,Consolas,monospace;color:#9AA69C;
  display:flex;align-items:center;gap:10px}
.code b{background:#F0F3F0;color:#171A18;font-weight:500;padding:3px 7px}
h1{font:800 clamp(2rem,6vw,3.2rem)/1.03 "Barlow",system-ui,sans-serif;
  letter-spacing:-.018em;margin:16px 0 12px;text-wrap:balance}
p.sub{color:#9AA69C;font-size:16px}
a{display:inline-block;margin-top:28px;background:#25C97A;color:#04140C;text-decoration:none;
  font:700 13px/1 "Barlow",system-ui,sans-serif;padding:14px 22px}
a:hover{background:#F0F3F0;color:#171A18}
:focus-visible{outline:2px solid #F0F3F0;outline-offset:2px}
</style>
